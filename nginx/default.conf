upstream kany_backend {
    # "backend"는 docker-compose의 서비스 이름. 같은 네트워크 안에서는 서비스 이름이 곧 주소다.
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /api/ 로 오는 요청만 Spring Boot로 넘긴다. 브라우저는 nginx 하나(포트 하나)만 알면 되고,
    # 프론트와 API 주소가 같아서 CORS 설정이 필요 없다.
    location /api/ {
        proxy_pass http://kany_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite 빌드 결과물은 파일명에 해시가 붙어서(내용이 바뀌면 이름도 바뀜) 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React는 화면 전환을 브라우저가 하므로, 서버에 없는 경로는 index.html을 돌려줘야 새로고침이 된다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
