# 프로젝트 이름. 컨테이너·볼륨 이름 앞에 붙는다. 같은 PC의 야구 티켓(ballpark-ticketing)과 겹치지 않게 분리한다.
name: kankan

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-kany}
      MYSQL_USER: ${DB_USERNAME:-kany}
      # ":?" 는 값이 없으면 실행을 막는다. 비밀번호를 깜빡하고 빈 값으로 뜨는 걸 방지한다.
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 호스트 3306(PC에 설치된 MySQL), 3307(야구 티켓)과 겹치지 않게 3308로 연다.
    # 컨테이너끼리는 호스트 포트와 무관하게 mysql:3306으로 통신한다.
    # 127.0.0.1로 묶어서 같은 와이파이의 다른 기기가 DB에 접속하지 못하게 한다.
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      # 컨테이너를 지워도 DB 데이터가 남도록 볼륨에 저장한다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    # ports를 열지 않는다. 바깥에서는 nginx를 거쳐서만 들어오고, backend는 내부 네트워크에서만 접근된다.
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-kany}
      DB_USERNAME: ${DB_USERNAME:-kany}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      mysql:
        # 컨테이너가 "시작"만 된 게 아니라 DB가 실제로 접속 가능해질 때까지 기다린다.
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
