spring:
  application:
    name: kany
  datasource:
    # 컨테이너 안에서는 docker-compose가 DB_HOST=mysql, DB_PORT=3306을 넣어준다.
    # 컨테이너 밖(IDE에서 직접 실행)이면 호스트에 열린 3308로 접속하는 기본값을 쓴다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:kany}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:kany}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 테이블은 Flyway(db/migration)만 만든다. Hibernate가 스키마를 바꾸지 못하게 검증만 한다.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      # nginx가 /api/ 로 들어온 요청만 백엔드로 넘기므로 헬스체크도 /api 아래에 둔다.
      base-path: /api/actuator
      exposure:
        include: health
